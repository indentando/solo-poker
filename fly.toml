# Configuración de Fly.io. Despliegue: `fly deploy --ha=false` (ver README).
#
# Las mesas viven en memoria, así que debe haber UNA sola máquina y siempre
# encendida: si se apaga o hay dos, las partidas se pierden o se reparten.

app = "solo-poker"
primary_region = "mad"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Cada jugador mantiene un WebSocket abierto: los límites por defecto (25) se quedan cortos.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
